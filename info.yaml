# Tiny Tapeout para tu proyecto de calculadora FPU
yaml_version: 6

project:
  title: "Sky130 FPU Calculator"
  description: "Una calculadora de punto flotante controlada por UART"
  # ... el resto de tus campos de configuración (author, language, etc.) ...# Tiny Tapeout project information
  yaml_version: "4"
  title:        "ASIC Floating-Point FPU Calculator"
  description:  "32-bit Floating-Point Unit Arithmetic Core integrated with an interactive UART Controller."
  author:       "Julian"
  top_module:   "tt_um_digital_asic_fp_calculator"
  language:     "Verilog"
  tiles:        "1x2"    
  clock_hz:     50000000  

  source_files:
    - "project.v"
    - "chip_top.v"
    - "fp_calculator_top.v"
    - "uart_controller.v"
    - "uart_tx.v"
    - "uart_rx.v"
    - "flopoco_synthesized.v"

