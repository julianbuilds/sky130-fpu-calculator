# Tiny Tapeout project information
project:
  title:        "Sky130 FP16 Calculator"
  author:       "Julian"
  discord:      ""
  description:  "Half-precision FP16 calculator with ADD, SUB, MUL, DIV, SQRT and POW via UART."
  language:     "Verilog"
  clock_hz:     10000000

  # Cambiamos a 4x2 para darle espacio real a los 1079 flip-flops
  tiles: "4x2"          # Valid values: 1x1 (digital only), 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  top_module:  "tt_um_digital_asic_fp_calculator"
  
  source_files:        
    - "project.v"
    - "chip_top.v"
    - "fp_calculator_top.v"
    - "uart_controller.v"
    - "uart_tx.v"
    - "uart_rx.v"
    - "fp16_synthesized.v"

pinout:
