# Tiny Tapeout project information
project:
  yaml_version: "4"
  title:        "ASIC Floating-Point FPU Calculator"
  description:  "32-bit Floating-Point Unit Arithmetic Core integrated with an interactive UART Controller."
  author:       "Julian"
  top_module:   "tt_um_digital_asic_fp_calculator"
  
  # Cuántos bloques de Tiny Tapeout ocupa. 
  # Tu diseño tiene la densidad optimizada, por lo que 1 tile (1x1) es suficiente.
  tiles: "1x1"    
  
  # Tu reloj maestro está seteado a un periodo de 20ns (50 MHz = 50000000 Hz)
  clock_hz: 50000000  

  # Lista estricta de todos los archivos de hardware en src/ que debe compilar
  source_files:
    - "project.v"
    - "chip_top.v"
    - "fp_calculator_top.v"
    - "uart_controller.v"
    - "uart_tx.v"
    - "uart_rx.v"
    - "flopoco_synthesized.v"

# Declaración de la distribución física de pines (Pinout)
