# Tiny Tapeout project information
project:
  title:        "ASIC Floating-Point FPU Calculator"
  description:  "32-bit Floating-Point Unit Arithmetic Core integrated with an interactive UART Controller for real-time calculation visualization."
  author:       "Julian"
  language:     "Verilog"
  top_module:   "tt_um_digital_asic_fp_calculator"

# Declaración de pines para la oblea física
pins:
  # Entradas dedicadas (ui_in)
  ui_in[0]: "UART RX (Serial Input from PC)"
  ui_in[1]: "Unused"
  ui_in[2]: "Unused"
  ui_in[3]: "Unused"
  ui_in[4]: "Unused"
  ui_in[5]: "Unused"
  ui_in[6]: "Unused"
  ui_in[7]: "Unused"

  # Salidas dedicadas (uo_out)
  uo_out[0]: "UART TX (Serial Output to PC)"
  uo_out[1]: "Unused"
  uo_out[2]: "Unused"
  uo_out[3]: "Unused"
  uo_out[4]: "Unused"
  uo_out[5]: "Unused"
  uo_out[6]: "Unused"
  uo_out[7]: "Unused"

  # Pines bidireccionales (uio_in / uio_out)
  uio_in[0]: "Unused"
  uio_in[1]: "Unused"
  uio_in[2]: "Unused"
  uio_in[3]: "Unused"
  uio_in[4]: "Unused"
  uio_in[5]: "Unused"
  uio_in[6]: "Unused"
  uio_in[7]: "Unused"